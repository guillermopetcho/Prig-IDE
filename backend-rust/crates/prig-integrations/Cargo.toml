[package]
name = "prig-integrations"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
thiserror = "1.0"
tracing = "0.1"
futures-util = "0.3"
bytes = "1.6"

prig-plataforma = { path = "../prig-plataforma" }
regex = "1"
libc = "0.2"
fancy-regex = "0.19"
zip = { version = "2", default-features = false, features = ["deflate"] }
prig-documentos = { path = "../prig-documentos" }
sha1 = "0.10"
prig-aprendizaje = { path = "../prig-aprendizaje" }
base64 = "0.22"
