[package]
name = "prig-documentos"
version = "0.1.0"
edition = "2021"

# Documentos PDF de Prig (exportar código, notebooks y repositorios explicados) con Typst como biblioteca, en lugar
# de reportlab + pygments (F5 de docs/plan-prig-rust.md).

[dependencies]
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
pulldown-cmark = { version = "0.13", default-features = false }
typst-layout = "0.15.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
