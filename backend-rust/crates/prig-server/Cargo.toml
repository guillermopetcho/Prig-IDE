[package]
name = "prig-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
http-body-util = "0.1"
bytes = "1.6"
futures-util = "0.3"
tokio-tungstenite = "0.24"
prig-fs = { path = "../prig-fs" }
# El árbol del explorador, el mismo núcleo que usa el backend de Python (un solo dueño)
prig-plataforma = { path = "../prig-plataforma" }
uuid = { version = "1", features = ["v4"] }
prig-aprendizaje = { path = "../prig-aprendizaje" }
prig-ia = { path = "../prig-ia" }
prig-recursos = { path = "../prig-recursos" }
prig-integrations = { path = "../prig-integrations" }
prig-biblioteca = { path = "../prig-biblioteca" }
prig-hardware = { path = "../prig-hardware" }
banco-core = { path = "../banco-core" }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

